apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
# Emits a mix of info / warn / error logs, like a real app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: log-generator }
  template:
    metadata:
      labels: { app: log-generator }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                r=$((RANDOM % 10))
                if [ $r -lt 6 ]; then echo "level=info msg=\"request handled\" status=200";
                elif [ $r -lt 8 ]; then echo "level=warn msg=\"slow response\" latency_ms=$((RANDOM % 2000))";
                else echo "level=error msg=\"database connection failed\" retry=true"; fi
                sleep 2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                r=$((RANDOM % 10))
                if [ $r -lt 7 ]; then echo "level=info msg=\"order placed\" order_id=$RANDOM";
                else echo "level=error msg=\"payment gateway timeout\" order_id=$RANDOM"; fi
                sleep 3
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
---
# Deliberately broken: exits immediately, so it ends up in CrashLoopBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashy
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: crashy }
  template:
    metadata:
      labels: { app: crashy }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'level=error msg=\"config file missing, exiting\"'; exit 1"]
